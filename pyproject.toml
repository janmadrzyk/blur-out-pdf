[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rectveil"
version = "0.1.0"
description = "A small Windows PDF reader with permanent area redaction"
requires-python = ">=3.11"
dependencies = ["PySide6>=6.8,<7", "PyMuPDF>=1.26,<2"]

[project.scripts]
rectveil = "rectveil.app:main"

[project.optional-dependencies]
dev = ["pytest>=8", "pyinstaller>=6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
rectveil = ["assets/*.png"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
