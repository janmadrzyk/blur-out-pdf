[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "blurout-pdf"
dynamic = ["version"]
description = "A small Windows PDF reader with permanent area redaction"
requires-python = ">=3.11"
dependencies = ["PySide6>=6.8,<7", "PyMuPDF>=1.26,<2", "Pillow>=11,<13"]

[project.scripts]
blurout-pdf = "blurout_pdf.app:main"

[project.optional-dependencies]
dev = ["pytest>=8", "pyinstaller>=6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = {attr = "blurout_pdf._version.VERSION"}

[tool.setuptools.package-data]
blurout_pdf = ["assets/*.png"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
