name: Windows build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test-and-package:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -e ".[dev]"
      - name: Test
        run: python -m pytest -q --basetemp=.pytest-temp
      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y
      - name: Build installer
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --windowed --onedir --name BlurOutPDF --paths src --icon packaging/app.ico --add-data "src/blurout_pdf/assets/app.png;blurout_pdf/assets" run.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/prepare_bundle.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "packaging\windows.iss"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: BlurOutPDF-Windows-installer
          path: dist/BlurOutPDF-Setup-*.exe
