name: Windows build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test-and-package:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.10'
      - name: Prepare release environment
        shell: pwsh
        run: |
          python -m venv .venv
          .\.venv\Scripts\python.exe -m pip install -c packaging\constraints-windows.txt -e ".[dev]"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Test
        shell: pwsh
        run: |
          .\.venv\Scripts\python.exe -m pytest -q --basetemp=.pytest-temp
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup --version=6.7.1 --no-progress -y
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build installer
        shell: pwsh
        run: |
          .\packaging\build.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Check installed Open-with registrations and uninstall cleanup
        shell: pwsh
        run: |
          .\.venv\Scripts\python.exe scripts\check_installer_runtime.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload installer runtime logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: BlurOutPDF-installer-runtime-logs
          path: build/installer-runtime/*.log
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: BlurOutPDF-Windows-installer
          path: |
            dist/BlurOutPDF-Setup-*.exe
            dist/SHA256.txt
          if-no-files-found: error
